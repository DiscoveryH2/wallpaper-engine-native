<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>潮汐</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081525}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas aria-label="缓慢流动的蓝色潮汐"></canvas><script>
(() => {
  'use strict';
  const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
  let width = 1, height = 1, phase = 0, last = null, speed = 1, fps = 60;
  let tint = [42, 155, 195], pointer = 0, pointerTarget = 0;
  function resize() {
    width = Math.max(1, innerWidth); height = Math.max(1, innerHeight);
    const scale = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * scale); canvas.height = Math.round(height * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0); draw();
  }
  function draw() {
    const sky = ctx.createLinearGradient(0, 0, 0, height);
    sky.addColorStop(0, '#071321'); sky.addColorStop(1, '#173d55');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, width, height);
    const x = width * .7 + pointer * width * .025, y = height * .30;
    const halo = ctx.createRadialGradient(x, y, 0, x, y, height * .48);
    halo.addColorStop(0, 'rgba(111,189,197,.24)'); halo.addColorStop(1, 'rgba(111,189,197,0)');
    ctx.fillStyle = halo; ctx.fillRect(0, 0, width, height);
    ctx.beginPath(); ctx.arc(x, y, height * .056, 0, Math.PI * 2);
    ctx.fillStyle = '#c3d7cb'; ctx.fill();
    for (let layer = 0; layer < 12; layer++) {
      const base = height * (.52 + layer * .035);
      ctx.beginPath(); ctx.moveTo(0, height);
      for (let i = 0; i <= 100; i++) {
        const u = i / 100, h = Math.sin(u * 7 + phase + layer * .36) * .05
          + Math.cos(u * 11 - phase * .7 + layer * .2) * .025;
        ctx.lineTo(u * width, base + h * height + pointer * Math.sin(u * Math.PI) * layer);
      }
      ctx.lineTo(width, height); ctx.closePath();
      ctx.fillStyle = `rgba(${tint[0]},${tint[1]},${tint[2]},${.10 + layer * .006})`; ctx.fill();
      ctx.strokeStyle = `rgba(140,225,230,${.08 + layer * .006})`; ctx.lineWidth = .8; ctx.stroke();
    }
  }
  function tick(now) {
    if (last === null) last = now;
    const elapsed = now - last;
    if (elapsed >= 1000 / fps - .5) {
      phase += Math.min(elapsed / 1000, .1) * .35 * speed;
      pointer += (pointerTarget - pointer) * .04; last = now; draw();
    }
    requestAnimationFrame(tick);
  }
  window.wallpaperPropertyListener = {
    applyUserProperties(properties) {
      if (properties.speed) speed = Math.min(3, Math.max(0, Number(properties.speed.value) || 0));
      if (properties.color) {
        const values = String(properties.color.value).trim().split(/\s+/).map(Number);
        if (values.length === 3 && values.every(Number.isFinite)) tint = values.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255));
      }
      draw();
    },
    applyGeneralProperties(properties) { if (properties.fps) fps = Math.max(1, Math.min(60, Number(properties.fps) || 60)); }
  };
  addEventListener('pointermove', event => { pointerTarget = event.clientX / width * 2 - 1; });
  addEventListener('resize', resize); resize(); requestAnimationFrame(tick);
})();
</script></body></html>
